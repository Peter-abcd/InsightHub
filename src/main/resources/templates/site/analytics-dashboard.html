<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>InsightHub 行为分析看板</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 24px;
            background: #f5f6fa;
            font-family: Arial, "Microsoft YaHei", sans-serif;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            color: #333;
        }

        .header p {
            color: #666;
            margin-top: 8px;
        }

        .toolbar {
            margin-bottom: 20px;
        }

        .toolbar button {
            padding: 8px 16px;
            margin-right: 10px;
            border: none;
            border-radius: 4px;
            background: #6c5ce7;
            color: white;
            cursor: pointer;
        }

        .toolbar button:hover {
            background: #5a4bd8;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(400px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }

        .card h3 {
            margin: 0 0 12px 0;
            color: #333;
            font-size: 18px;
        }

        .chart {
            width: 100%;
            height: 360px;
        }

        .wide {
            grid-column: span 2;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>InsightHub 用户行为分析看板</h1>
    <p>基于 Kafka + ClickHouse 的社区行为数据分析</p>
</div>

<div class="toolbar">
    <button onclick="loadAll()">刷新数据</button>
    <button onclick="mockBehavior()">生成模拟行为</button>
    <button onclick="clearData()">清空行为数据</button>
</div>

<div class="grid">
    <div class="card">
        <h3>行为类型统计</h3>
        <div id="eventTypeChart" class="chart"></div>
    </div>

    <div class="card">
        <h3>搜索关键词排行</h3>
        <div id="keywordChart" class="chart"></div>
    </div>

    <div class="card">
        <h3>热门帖子排行</h3>
        <div id="hotPostChart" class="chart"></div>
    </div>

    <div class="card">
        <h3>DAU 统计</h3>
        <div id="dauChart" class="chart"></div>
    </div>

    <div class="card wide">
        <h3>每日行为趋势</h3>
        <div id="trendChart" class="chart"></div>
    </div>
</div>

<script>
    const eventTypeChart = echarts.init(document.getElementById('eventTypeChart'));
    const keywordChart = echarts.init(document.getElementById('keywordChart'));
    const hotPostChart = echarts.init(document.getElementById('hotPostChart'));
    const dauChart = echarts.init(document.getElementById('dauChart'));
    const trendChart = echarts.init(document.getElementById('trendChart'));

    async function getJson(url) {
        const response = await fetch(url);
        return await response.json();
    }

    async function loadEventTypes() {
        const res = await getJson('/dev/analytics/event-types');
        const data = res.data || [];

        eventTypeChart.setOption({
            tooltip: {},
            xAxis: {
                type: 'category',
                data: data.map(item => item.event_type)
            },
            yAxis: {
                type: 'value'
            },
            series: [{
                type: 'bar',
                data: data.map(item => item.cnt)
            }]
        });
    }

    async function loadSearchKeywords() {
        const res = await getJson('/dev/analytics/search-keywords?limit=10');
        const data = res.data || [];

        keywordChart.setOption({
            tooltip: {},
            xAxis: {
                type: 'category',
                data: data.map(item => item.keyword)
            },
            yAxis: {
                type: 'value'
            },
            series: [{
                type: 'bar',
                data: data.map(item => item.cnt)
            }]
        });
    }

    async function loadHotPosts() {
        const res = await getJson('/dev/analytics/hot-posts?limit=10');
        const data = res.data || [];

        hotPostChart.setOption({
            tooltip: {},
            xAxis: {
                type: 'category',
                data: data.map(item => '帖子' + item.post_id)
            },
            yAxis: {
                type: 'value'
            },
            series: [{
                type: 'bar',
                data: data.map(item => item.views)
            }]
        });
    }

    async function loadDau() {
        const res = await getJson('/dev/analytics/dau');
        const data = res.data || [];

        dauChart.setOption({
            tooltip: {},
            xAxis: {
                type: 'category',
                data: data.map(item => item.event_date)
            },
            yAxis: {
                type: 'value'
            },
            series: [{
                type: 'line',
                data: data.map(item => item.dau)
            }]
        });
    }

    async function loadDailyTrend() {
        const res = await getJson('/dev/analytics/daily-trend');
        const data = res.data || [];

        const dates = [...new Set(data.map(item => item.event_date))].reverse();
        const eventTypes = [...new Set(data.map(item => item.event_type))];

        const series = eventTypes.map(type => {
            return {
                name: type,
                type: 'line',
                data: dates.map(date => {
                    const row = data.find(item => item.event_date === date && item.event_type === type);
                    return row ? row.cnt : 0;
                })
            };
        });

        trendChart.setOption({
            tooltip: {
                trigger: 'axis'
            },
            legend: {
                data: eventTypes
            },
            xAxis: {
                type: 'category',
                data: dates
            },
            yAxis: {
                type: 'value'
            },
            series: series
        });
    }

    async function loadAll() {
        await Promise.all([
            loadEventTypes(),
            loadSearchKeywords(),
            loadHotPosts(),
            loadDau(),
            loadDailyTrend()
        ]);
    }

    async function mockBehavior() {
        await fetch('/dev/mock-behavior?viewCount=100&searchCount=50&likeCount=50&commentCount=20&followCount=10', {
            method: 'POST'
        });

        setTimeout(loadAll, 4000);
    }

    async function clearData() {
        if (!confirm('确认清空 ClickHouse 行为数据吗？')) {
            return;
        }

        await fetch('/dev/analytics/clear', {
            method: 'POST'
        });

        setTimeout(loadAll, 1000);
    }

    window.addEventListener('resize', function () {
        eventTypeChart.resize();
        keywordChart.resize();
        hotPostChart.resize();
        dauChart.resize();
        trendChart.resize();
    });

    loadAll();
</script>

</body>
</html>
