# 端口
server.port=8080
server.servlet.context-path=

# 网站域名
community.path.domain=http://localhost:8080

# Editor.Md 图片上传路径
# Windows 可以这样：
# community.path.editormdUploadPath=D:/echo/uploads/editor-md-upload
# Mac / Linux 可以这样：
community.path.editormdUploadPath=/tmp/echo/editor-md-upload

# Thymeleaf
spring.thymeleaf.cache=false

# MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/greatecommunity?characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.jdbc.Driver

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.greate.community.entity
mybatis.configuration.useGeneratedKeys=true
mybatis.configuration.mapUnderscoreToCamelCase=true

# Spring Mail
# 先跑通项目可以保留占位；注册激活功能后面再处理
spring.mail.host=smtp.qq.com
spring.mail.port=465
spring.mail.username=你的邮箱
spring.mail.password=你的SMTP授权码
spring.mail.protocol=smtps
spring.mail.properties.mail.smtp.ssl.enable=true

# Redis
spring.redis.database=11
spring.redis.host=localhost
spring.redis.port=6379

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=echo-consumer-group
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.auto-commit-interval=3000

# Elasticsearch
spring.data.elasticsearch.cluster-name=community
spring.data.elasticsearch.cluster-nodes=127.0.0.1:9300

# Quartz
spring.quartz.job-store-type=jdbc
spring.quartz.scheduler-name=communityScheduler
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.jobStore.class=org.quartz.impl.jdbcjobstore.JobStoreTX
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.StdJDBCDelegate
spring.quartz.properties.org.quartz.jobStore.isClustered=true
spring.quartz.properties.org.quartz.threadPool.class=org.quartz.simpl.SimpleThreadPool
spring.quartz.properties.org.quartz.threadPool.threadCount=5

# 七牛云
# 先跑通可以保留占位；头像上传后面可以改成本地存储
qiniu.key.access=xxx
qiniu.key.secret=xxx
qiniu.bucket.header.name=xxx
qiniu.bucket.header.url=http://localhost:8080

# Caffeine
caffeine.posts.max-size=15
caffeine.posts.expire-seconds=180

# 开发环境关闭邮箱激活，注册后直接可登录
community.register.activation-required=false

# Service 层调用日志，默认关闭，排查问题时再打开
community.service-log.enabled=false
logging.level.com.greate.community.aspect.ServiceLogAspect=INFO
